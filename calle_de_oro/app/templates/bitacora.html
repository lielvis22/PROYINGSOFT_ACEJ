{% extends "base.html" %}
{% block titulo %}Bitácora{% endblock %}
{% block contenido %}
  <h2>Bitácora</h2>
  <p class="subtitulo">Quién hizo qué y cuándo (RNF-12)</p>
  <div class="caja">
    <table>
      <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr>
      {% for r in registros %}
      <tr><td>{{ r.fecha }}</td><td>{{ r.usuario }}</td><td>{{ r.accion }}</td><td>{{ r.detalle }}</td></tr>
      {% endfor %}
    </table>
  </div>
{% endblock %}
